<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán Giá Nhà</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h2>Dự Đoán Giá Nhà</h2>
        
        <form id="priceForm">
            <div class="form-group">
                <label for="area">Diện tích (m²):</label>
                <input type="number" id="area" step="0.1" required placeholder="Ví dụ: 80">
            </div>

            <div class="form-group">
                <label for="bedrooms">Số phòng ngủ:</label>
                <input type="number" id="bedrooms" min="0" required placeholder="Ví dụ: 3">
            </div>

            <div class="form-group">
                <label for="location">Vị trí:</label>
                <select id="location">
                    <option value="hanoi">Hà Nội</option>
                    <option value="hcmc">TP. Hồ Chí Minh</option>
                    <option value="other" selected>Khác</option>
                </select>
            </div>

            <button type="submit">Dự đoán giá</button>
        </form>

        <div id="result" style="display: none;"></div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: auto; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        input, button, select { padding: 8px; margin: 4px 0; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 3px; }
        button:hover { background-color: #0056b3; }
        .btn-danger { background-color: #dc3545; }
        .btn-danger:hover { background-color: #a71d2a; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Quản lý Danh sách Sản phẩm</h2>

    <!-- Form tìm kiếm & Lọc -->
    <div class="card">
        <h3>Bộ lọc & Tìm kiếm</h3>
        <input type="text" id="search-q" placeholder="Tìm tên (ít nhất 2 ký tự)...">
        <input type="number" id="min-price" placeholder="Giá tối thiểu">
        <input type="number" id="max-price" placeholder="Giá tối đa">
        
        <select id="sort-by">
            <option value="id">Xếp theo ID</option>
            <option value="name">Xếp theo Tên</option>
            <option value="price">Xếp theo Giá</option>
        </select>
        
        <select id="order">
            <option value="asc">Tăng dần</option>
            <option value="desc">Giảm dần</option>
        </select>

        <button onclick="fetchData()">Lọc dữ liệu</button>
    </div>

    <!-- Form thêm mới -->
    <div class="card">
        <h3>Thêm sản phẩm mới</h3>
        <input type="text" id="new-name" placeholder="Tên sản phẩm">
        <input type="number" id="new-price" placeholder="Giá">
        <button onclick="createItem()">Thêm mới</button>
        <p id="form-error" class="error"></p>
    </div>

    <!-- Bảng hiển thị -->
    <p id="total-info">Đang tải dữ liệu...</p>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên sản phẩm</th>
                <th>Giá (VNĐ)</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="item-tbody"></tbody>
    </table>
</div>

<script src="/static/app.js"></script>
</body>
</html>
